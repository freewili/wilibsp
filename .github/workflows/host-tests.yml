name: host tests

# The host tree needs no Pico SDK and no board, so it runs on a stock runner.
# Hardware-backed verification still belongs on a bench: nothing here can
# stand in for flashing an app and looking at the panel.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive   # libs/onewili, or the configure step fails

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Run the host test tree
        run: python tools/fw.py test
