# tools/openocd/freewili2.cfg — OpenOCD config for the FreeWili2 (RP2350B) over
# the Raspberry Pi Debug Probe (CMSIS-DAP / SWD). Used by `fw flash` and `fw rtt`.
#
# The interface/target includes below use `[find ...]`, which resolves against
# OpenOCD's script search path. The `fw` CLI passes `-s <pico-sdk openocd
# scripts dir>` automatically; if you invoke openocd by hand, add that -s too.
source [find interface/cmsis-dap.cfg]
cmsis-dap usb interface 0
adapter speed 5000
source [find target/rp2350.cfg]

# Attach to a RUNNING target without disturbing it.
#
# rp2350.cfg overrides `proc init_reset` to perform a full reset, and OpenOCD's
# `init` calls it. For a flashed app that is invisible -- the core simply
# restarts from flash, which is why `fw rtt` has always looked fine against
# fw2-doom and the apps/ tree. For a RAM or PSRAM app it is FATAL: the reset
# erases the staged image, so `fw rtt` / `fw screenshot` destroy the app they
# were asked to observe and then report "rtt: No control block found".
#
# Verified against a running PSRAM app: with these two lines the image at
# 0x11000000 survives the attach (vector table still reads
# 20082000 1100015b) and RTT finds its control block.
#
# `fw flash` still resets deliberately -- it passes `program ... verify reset`,
# which drives the reset itself rather than relying on init.
proc init_reset { mode } { }
reset_config none separate
